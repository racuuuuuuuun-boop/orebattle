<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オレバトル — 動きの再現デモ</title>
<style>
  :root { --bg:#101418; --panel:#1a2129; --text:#e8eef4; --sub:#8fa0b0; --accent:#4fd1ff; --warn:#ffb454; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif; min-height:100vh; }
  header { padding:16px 20px 8px; }
  header h1 { font-size:20px; letter-spacing:.04em; }
  header p { color:var(--sub); font-size:12px; margin-top:2px; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 40px; }
  section { margin-top:12px; }
  .card { background:var(--panel); border-radius:14px; padding:18px; }
  .lead { font-size:14px; line-height:1.8; }
  .note { color:var(--sub); font-size:12px; margin-top:10px; line-height:1.6; }
  .bigbtn { display:block; text-align:center; background:var(--accent); color:#062434; font-weight:700; font-size:16px; border:none; border-radius:12px; padding:16px; margin-top:16px; width:100%; cursor:pointer; }
  .bigbtn:active { transform:scale(.98); }
  button.sub { background:#2a3542; color:var(--text); border:none; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; }
  progress { width:100%; height:10px; margin-top:12px; accent-color:var(--accent); }
  #status { font-size:14px; line-height:1.7; }
  #cv { width:100%; border-radius:14px; background:#0a0d10; display:block; }
  .controls { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .controls label { font-size:13px; color:var(--sub); display:flex; align-items:center; gap:4px; }
  .verify { margin-top:12px; background:var(--panel); border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.9; color:var(--sub); }
  .verify b { color:var(--text); }
  .verify .ok { color:var(--accent); }
  .verify .bad { color:var(--warn); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>オレバトル</h1>
  <p>デモ 段階0「動きの再現」 — 撮った動きを棒人間がそのまま再現します</p>
</header>
<main>
  <section id="step-select" class="card">
    <p class="lead">5秒くらいの動き（パンチ・キック・ダンス、なんでも）を撮るか、撮ってある動画を選んでください。<b>全身が映っている</b>のがコツです。</p>
    <label class="bigbtn">動画を選ぶ／撮る<input type="file" id="file" accept="video/*" hidden></label>
    <p class="note">動画はこの画面の中だけで処理され、どこにも送信されません。10秒より長い動画は最初の10秒だけ使います。</p>
    <p class="note" id="selmsg" style="color:var(--warn)" hidden></p>
  </section>

  <section id="step-analyze" class="card" hidden>
    <div id="status">準備中…</div>
    <progress id="prog" max="100" value="0"></progress>
  </section>

  <section id="step-play" hidden>
    <canvas id="cv"></canvas>
    <div class="controls">
      <button class="sub" id="replay">もう一回</button>
      <label><input type="checkbox" id="loop" checked>くり返し</label>
      <button class="sub" id="restart">別の動画で試す</button>
    </div>
    <div id="verify" class="verify"></div>
  </section>
</main>

<video id="vid" playsinline muted preload="auto" hidden></video>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const stepSelect = $("step-select"), stepAnalyze = $("step-analyze"), stepPlay = $("step-play");
const statusEl = $("status"), prog = $("prog"), vid = $("vid"), cv = $("cv"), ctx = cv.getContext("2d");

const FPS = 30;          // 解析の間隔（1秒あたりのコマ数）
const MAX_SEC = 10;      // 使う長さの上限
const VIS_MIN = 0.3;     // これ未満の関節は描かない

let landmarker = null, delegate = "GPU";
let frames = [], videoAspect = 9 / 16, procSec = 0;
let playing = false, playStart = 0;

// ---- AIモデルの読み込み（GPUで失敗したらCPUに切り替え） ----
async function initModel() {
  if (landmarker) return;
  statusEl.textContent = "AIモデルを読み込み中…（初回は少し時間がかかります）";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: d
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  try {
    landmarker = await PoseLandmarker.createFromOptions(vision, opts("GPU"));
    delegate = "GPU";
  } catch (e) {
    landmarker = await PoseLandmarker.createFromOptions(vision, opts("CPU"));
    delegate = "CPU";
  }
}

// ---- 動画の指定時刻へ移動（seekedが来ないブラウザ向けに0.5秒で諦める保険つき） ----
function seek(v, t) {
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done) { done = true; v.removeEventListener("seeked", fin); res(); } };
    v.addEventListener("seeked", fin);
    setTimeout(fin, 500);
    v.currentTime = Math.min(t, Math.max(0, v.duration - 0.001));
  });
}
const nextFrame = () => new Promise(r => setTimeout(r, 0));   // 画面が隠れていても解析が止まらないようにrAFは使わない

// ---- 解析本体 ----
async function analyze(file) {
  stepSelect.hidden = true; stepPlay.hidden = true; stepAnalyze.hidden = false;
  prog.value = 0;
  try {
    await initModel();
  } catch (e) {
    statusEl.textContent = "AIモデルの読み込みに失敗しました。電波の良いところでページを開き直してください。（" + e.message + "）";
    return;
  }

  vid.src = URL.createObjectURL(file);
  await new Promise((res, rej) => {
    vid.onloadedmetadata = res;
    vid.onerror = () => rej(new Error("動画を読み込めませんでした"));
  }).catch(e => { statusEl.textContent = e.message + "。別の動画で試してください。"; });
  if (!vid.duration) return;
  if (!isFinite(vid.duration)) {           // 録画直後のwebmは長さ不明のことがある→一度末尾へ飛ばして確定させる
    await new Promise(res => {
      const fin = () => { vid.removeEventListener("seeked", fin); res(); };
      vid.addEventListener("seeked", fin);
      setTimeout(fin, 1500);
      vid.currentTime = 1e7;
    });
    vid.currentTime = 0;
    if (!isFinite(vid.duration)) { statusEl.textContent = "この動画は長さを読み取れませんでした。別の動画で試してください。"; return; }
  }

  videoAspect = vid.videoWidth && vid.videoHeight ? vid.videoWidth / vid.videoHeight : 9 / 16;
  const dur = Math.min(vid.duration, MAX_SEC);
  const total = Math.max(1, Math.floor(dur * FPS));
  frames = [];
  let lastTs = -1;
  const t0 = performance.now();

  for (let i = 0; i < total; i++) {
    const t = i / FPS;
    await seek(vid, t);
    let ts = Math.round(t * 1000);
    if (ts <= lastTs) ts = lastTs + 1;   // タイムスタンプは増え続ける必要がある
    lastTs = ts;
    let lm = null;
    try {
      const res = landmarker.detectForVideo(vid, ts);
      if (res.landmarks && res.landmarks[0]) {
        lm = res.landmarks[0].map(p => [p.x, p.y, p.visibility ?? 1]);
      }
    } catch (e) { /* このコマは検出なし扱い */ }
    frames.push(lm);
    if (i % 3 === 0) {
      prog.value = (i / total) * 100;
      statusEl.textContent = `動きを解析中… ${Math.round((i / total) * 100)}%`;
      await nextFrame();
    }
  }
  procSec = (performance.now() - t0) / 1000;
  URL.revokeObjectURL(vid.src);

  const detected = frames.filter(f => f).length;
  if (detected === 0) {
    stepAnalyze.hidden = true; stepSelect.hidden = false;
    const m = $("selmsg");
    m.textContent = "人の姿を見つけられませんでした。明るい場所で、全身がカメラに入るように撮ってみてください。";
    m.hidden = false;
    return;
  }
  showPlayer(dur, detected);
}

// ---- 検証パネル（Gauntlet Loop: 数字で嘘をつけなくする） ----
function showVerify(dur, detected) {
  const total = frames.length;
  const rate = Math.round((detected / total) * 100);
  const grade = rate >= 90 ? '<span class="ok">◎ きれいに取れています</span>'
              : rate >= 70 ? '<span class="ok">○ おおむね取れています</span>'
              : '<span class="bad">⚠ 検出が不安定です。明るい場所で全身が映るように撮り直すと改善します</span>';
  $("verify").innerHTML =
    `<b>検証パネル</b><br>` +
    `長さ: <b>${dur.toFixed(1)}秒</b>（${total}コマ） ／ 検出できたコマ: <b>${detected}</b>（${rate}%）<br>` +
    `解析時間: <b>${procSec.toFixed(1)}秒</b> ／ 処理: <b>${delegate}</b><br>` + grade;
}

function showPlayer(dur, detected) {
  stepAnalyze.hidden = true; stepPlay.hidden = false;
  const w = Math.min(stepPlay.clientWidth || 520, 560);
  let h = Math.round(w / videoAspect);
  const maxH = Math.round(window.innerHeight * 0.62);
  let drawW = w;
  if (h > maxH) { drawW = Math.round(maxH * videoAspect); h = maxH; }
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv._w = w; cv._h = h; cv._drawW = drawW;
  showVerify(dur, detected);
  startPlayback();
}

// ---- 棒人間の描画 ----
const BONES = [
  [11,12],[11,23],[12,24],[23,24],           // 胴体
  [11,13],[13,15],[12,14],[14,16],           // 腕
  [23,25],[25,27],[24,26],[26,28],           // 脚
  [27,29],[29,31],[28,30],[30,32]            // 足先
];

function drawFrame(lm) {
  const w = cv._w, h = cv._h, drawW = cv._drawW, offX = (w - drawW) / 2;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#0a0d10"; ctx.fillRect(0, 0, w, h);
  if (!lm) return;
  const px = p => [offX + p[0] * drawW, p[1] * h];
  ctx.strokeStyle = "#4fd1ff"; ctx.lineCap = "round";
  ctx.lineWidth = Math.max(3, drawW / 60);
  for (const [a, b] of BONES) {
    if (lm[a][2] < VIS_MIN || lm[b][2] < VIS_MIN) continue;
    const [x1, y1] = px(lm[a]), [x2, y2] = px(lm[b]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  // 頭: 鼻の位置に、肩幅から決めた大きさの丸
  if (lm[0][2] >= VIS_MIN && lm[11][2] >= VIS_MIN && lm[12][2] >= VIS_MIN) {
    const [nx, ny] = px(lm[0]);
    const [sx1] = px(lm[11]), [sx2] = px(lm[12]);
    const r = Math.max(6, Math.abs(sx1 - sx2) * 0.35);
    ctx.beginPath(); ctx.arc(nx, ny - r * 0.3, r, 0, Math.PI * 2); ctx.stroke();
  }
}

// ---- 再生 ----
function startPlayback() {
  playing = true; playStart = performance.now();
  let lastGood = null;
  const tick = () => {
    if (!playing) return;
    const elapsed = (performance.now() - playStart) / 1000;
    let idx = Math.floor(elapsed * FPS);
    if (idx >= frames.length) {
      if ($("loop").checked) { playStart = performance.now(); idx = 0; }
      else { playing = false; return; }
    }
    if (frames[idx]) lastGood = frames[idx];
    drawFrame(lastGood);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ---- 操作 ----
$("file").addEventListener("change", e => {
  $("selmsg").hidden = true;
  const f = e.target.files[0];
  if (f) analyze(f);
  e.target.value = "";
});
$("replay").addEventListener("click", () => { playing = false; setTimeout(startPlayback, 50); });
$("restart").addEventListener("click", () => {
  playing = false;
  stepPlay.hidden = true; stepSelect.hidden = false;
});

// 検証用フック（開発時のみ使用・アプリの動作には関与しない）
window.__oreDraw = lm => drawFrame(lm);
window.__oreTest = (fakeFrames, aspect) => {
  frames = fakeFrames; videoAspect = aspect || 9 / 16; procSec = 0;
  stepSelect.hidden = true; stepAnalyze.hidden = true;
  showPlayer(fakeFrames.length / FPS, fakeFrames.filter(f => f).length);
};

// ページを開いた時点で裏でモデルを読み始めておく（体感を速くする）
initModel().catch(() => { /* 選択時にもう一度試す */ });
</script>
</body>
</html>
